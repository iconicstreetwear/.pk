<!DOCTYPE html>

<head>

    <header class="page-header container text-center has-grain">
      <p class="eyebrow reveal is-visible" style="margin-bottom:18px;">Policy</p>
      <h1 class="display reveal is-visible"><span class="scribble">Shipping</span></h1>

<script>document.addEventListener("DOMContentLoaded",()=>{
  const d=CONTENT.shipping; document.getElementById("intro").textContent=d.intro;
  document.getElementById("pts").innerHTML=d.points.map(p=>`<li>${p}</li>`).join("");
  document.getElementById("hl").textContent=d.charge;
  initScrollReveal();});</script>
