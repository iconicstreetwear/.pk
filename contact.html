<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — ICONICWEAR</title>
  <meta name="description" content="Reach ICONICWEAR through Instagram or email.">
  <meta property="og:title" content="Contact — ICONICWEAR">
  <meta property="og:description" content="Reach ICONICWEAR through Instagram or email.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/images/icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav" id="site-nav"></nav>
  <main>
    <header class="page-header container text-center has-grain">
      <p class="eyebrow reveal is-visible" style="margin-bottom:18px;">Get in touch</p>
      <h1 class="display reveal is-visible"><span class="scribble">Let's talk.</span></h1>
      
    </header>
    <section class="section-tight"><div class="container text-center" style="max-width:600px;">
      <p class="lede center-lede reveal" id="contact-sub"></p>
      <div class="contact-cta-row reveal" style="margin-top:34px;">
        <a id="ig-btn" class="btn btn-primary" target="_blank" rel="noopener"></a>
        <a id="mail-btn" class="btn btn-outline"></a>
      </div>
      <p class="form-note reveal" style="margin-top:28px;">Ordering? Message us on Instagram with the product name and your size.</p>
    </div></section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("contact-sub").textContent = CONTENT.contact.supporting;
  const ig=document.getElementById("ig-btn"); ig.href=CONTENT.social.iconicwear.url; ig.innerHTML=`<span class="btn-icon">${ICONS.instagram}</span> Instagram`;
  const m=document.getElementById("mail-btn"); m.href="mailto:"+CONTENT.contact.email; m.innerHTML=`<span class="btn-icon">${ICONS.mail}</span> Email us`;
  initScrollReveal();});</script>
</body>
</html>
