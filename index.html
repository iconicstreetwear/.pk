  <title>ICONICWEAR — Streetwear Made to Be Worn</title>
  <meta name="description" content="ICONICWEAR is an independent Pakistani streetwear label creating wearable pieces with a distinct identity. Streetwear made to be worn.">
  <meta property="og:title" content="ICONICWEAR — Streetwear Made to Be Worn">
  <meta property="og:description" content="ICONICWEAR is an independent Pakistani streetwear label creating wearable pieces with a distinct identity. Streetwear made to be worn.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/campaign/campaign-02-sidequest.jpg">
  <link rel="icon" href="assets/images/icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav" id="site-nav" aria-label="Main"></nav>
  <main>
    <div id="strips" class="strips"></div>
    <section class="brand-head container">
      <h1 class="display grad">ICONICWEAR</h1>
      <p id="brand-tag"></p>
    </section>
    <div id="campaigns"></div>
    <section class="section rule" aria-labelledby="newin">
      <div class="container">
        <div class="sec-head"><h2 class="display" id="newin"></h2><p class="lede" id="newin-sub"></p></div>
        <div class="grid" id="home-grid"></div>
        <p class="text-center" style="margin-top:36px"><a class="btn btn-outline" href="collection.html">View all →</a></p>
      </div>
    </section>
    <section class="section rule" id="process">
      <div class="container">
        <div class="sec-head"><h2 class="display" id="process-h"></h2><p class="lede" id="process-s"></p></div>
        <div class="process" id="process-grid"></div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("brand-tag").textContent = CONTENT.brand.tagline;
      document.getElementById("campaigns").innerHTML = CONTENT.campaigns.map(c => `
        <section class="campaign reveal" aria-label="${esc(c.title)}">
          <div class="container">
            <a class="campaign-img" href="${c.href}" tabindex="-1" aria-hidden="true"><img src="${c.image}" alt="${esc(c.alt)}" width="1672" height="941" loading="${c.number === "01" ? "eager" : "lazy"}"></a>
            <div class="campaign-bar">
              <div><p class="eyebrow">Campaign ${c.number}</p><h2 class="display">${esc(c.title)}</h2></div>
              <a class="btn btn-${c.style}" href="${c.href}">${esc(c.button)}</a>
            </div>
          </div>
        </section>`).join("");
      document.getElementById("newin").textContent = CONTENT.featuredSection.heading;
      document.getElementById("newin-sub").textContent = CONTENT.featuredSection.supporting;
      const P = CONTENT.orderProcess;
      document.getElementById("process-h").textContent = P.heading;
      document.getElementById("process-s").textContent = P.supporting;
      document.getElementById("process-grid").innerHTML = P.steps.map(s => `<div class="step"><b>${s.step}</b><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p></div>`).join("");
      initScrollReveal();
    });
  </script>
</body>
</html>
