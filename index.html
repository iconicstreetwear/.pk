<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICONICWEAR — Streetwear Made to Be Worn</title>
  <meta name="description" content="ICONICWEAR is a Pakistan-focused streetwear brand building its first signature collection.">
  <meta property="og:title" content="ICONICWEAR — Streetwear Made to Be Worn">
  <meta property="og:description" content="ICONICWEAR is a Pakistan-focused streetwear brand building its first signature collection.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/banners/banner-01.jpg">
  <link rel="icon" href="assets/images/icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cinema.css">
</head>
<body>

  <nav class="site-nav" id="site-nav"></nav>

  <main>
    <!-- CINEMATIC OPENING SEQUENCE
         One pinned scroll stage: environment establishes, wordmark
         holds and releases, the model rises and the garment
         cross-fades through real ICONICWEAR states, then a product
         beat surfaces before handing off into the normal page flow. -->
    <div class="cinema-wrap" id="cinema-wrap">
      <div class="cinema-stage">
        <div class="cinema-layer cinema-bg">
          <img src="assets/images/cinema/env-archway.jpg" alt="" loading="eager">
        </div>

        <div class="cinema-layer cinema-artifact" aria-hidden="true"></div>

        <div class="cinema-layer cinema-word">
          <h1 id="cinema-brand"></h1>
          <p id="cinema-tagline"></p>
        </div>

        <div class="cinema-layer cinema-model">
          <div class="cinema-model-frame" id="cinema-model-frame">
            <img class="garment-state" src="assets/images/cinema/model-base.png" alt="ICONICWEAR model" loading="eager" style="opacity:1;">
            <img class="garment-state" src="assets/images/cinema/overlay-logo.png" alt="" aria-hidden="true" data-overlay="logo">
            <img class="garment-state" src="assets/images/cinema/overlay-black-tee.png" alt="" aria-hidden="true" data-overlay="black">

            <button type="button" class="garment-arrow garment-arrow--prev" id="garment-prev" aria-label="Previous look">‹</button>
            <button type="button" class="garment-arrow garment-arrow--next" id="garment-next" aria-label="Next look">›</button>
            <div class="garment-dots" id="garment-dots" aria-hidden="true"></div>
          </div>
        </div>

        <div class="cinema-layer cinema-product">
          <div class="cinema-product-tag">
            <span class="num" id="cinema-product-num"></span>
            <span class="name" id="cinema-product-name"></span>
            <span class="price" id="cinema-product-price"></span>
          </div>
        </div>

        <div class="cinema-grain" aria-hidden="true"></div>

        <div class="cinema-scroll-cue">
          <span class="line"></span>
          <span>Scroll</span>
        </div>
      </div>
    </div>

    <!-- FIRST DROP (short, centered intro) -->
    <section class="section-tight" aria-labelledby="featured-heading">
      <div class="container text-center">
        <div class="reveal tilt-in">
          <h2 class="display section-heading" id="featured-heading"></h2>
          <p class="lede center-lede" id="featured-supporting" style="margin-top:14px;"></p>
        </div>
      </div>
    </section>

    <!-- OUR STORY (compact, centered, textured) -->
    <section class="section section-charcoal section-border-top has-grain">
      <div class="container text-center reveal tilt-in" style="max-width:760px;">
        <p class="eyebrow" id="story-eyebrow" style="margin-bottom:16px;"></p>
        <h2 class="display" id="story-heading" style="font-size:clamp(1.8rem,3.6vw,2.8rem);margin-bottom:20px;"></h2>
        <p class="serif-accent" id="story-body" style="font-size:1.15rem;color:var(--grey);"></p>
        <a href="about.html" class="home-story-cta" id="story-cta" style="margin-top:24px;display:inline-block;"></a>
      </div>
    </section>

    <!-- PRODUCT SHOWCASE -->
    <section class="section section-border-top">
      <div class="container text-center">
        <p class="eyebrow reveal" style="margin-bottom:28px;">The collection</p>
      </div>
      <div class="container">
        <div class="product-grid" id="home-product-grid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cinema.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Cinema opening — real brand data, no invented copy
      document.getElementById("cinema-brand").textContent = CONTENT.brand.name;
      document.getElementById("cinema-tagline").textContent = CONTENT.brand.tagline;

      const finalProduct = CONTENT.products[CONTENT.products.length - 1];
      document.getElementById("cinema-product-num").textContent = finalProduct.id;
      document.getElementById("cinema-product-name").textContent = finalProduct.name;
      document.getElementById("cinema-product-price").textContent = finalProduct.price || "";

      document.getElementById("featured-heading").textContent = CONTENT.featuredSection.heading;
      document.getElementById("featured-supporting").textContent = CONTENT.featuredSection.supporting;

      document.getElementById("story-eyebrow").textContent = CONTENT.homeStory.eyebrow;
      document.getElementById("story-heading").textContent = CONTENT.homeStory.heading;
      document.getElementById("story-body").textContent = CONTENT.homeStory.body;
      const cta = document.getElementById("story-cta");
      cta.textContent = CONTENT.homeStory.ctaLabel;
      cta.href = CONTENT.homeStory.ctaHref;

      initScrollReveal();
    });
  </script>
</body>
</html>
